name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Code Quality - Ruff Lint
        run: |
          python -m ruff check .

      - name: Code Formatting - Black Check
        run: |
          python -m black --check esim_tool_manager tests

      - name: Static Type Checking - Mypy
        run: |
          python -m mypy esim_tool_manager

      - name: Unit, Integration & Security Tests with Coverage
        run: |
          python -m pytest --cov=esim_tool_manager --cov-report=term-missing --cov-report=xml

      - name: Security Vulnerability Scan - pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
