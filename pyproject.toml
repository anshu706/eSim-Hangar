[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esim-tool-manager"
version = "0.1.0"
description = "Automated Tool Manager for FOSSEE eSim EDA"
authors = [
    { name = "eSim Developer", email = "developer@fossee.in" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "rich>=12.0",
    "packaging>=21.0",
    "requests>=2.28.0",
]

[project.scripts]
esim-tool-manager = "esim_tool_manager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["esim_tool_manager*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
